<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة المياه الوطنية</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  /* ===== عدّل ألوان الهوية من هنا ===== */
  :root{
    --brand:#0071BB;      /* أزرق الهوية */
    --brand2:#00A7E2;     /* سماوي الهوية */
    --accent:#03A88B;     /* أخضر الهوية */
    --bg1:#001433; --bg2:#002060;
    --text:#eaf4ff; --muted:#8fb3d6;
    --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg1);color:var(--text);
    font-family:"Almarai","Inter",sans-serif;cursor:none}
  body{background:radial-gradient(1200px 800px at 85% -10%,#005C92 0%,transparent 60%),
       radial-gradient(900px 700px at -10% 110%,#00595A 0%,transparent 60%),
       linear-gradient(160deg,var(--bg2),var(--bg1))}
  .en{font-family:"Inter",sans-serif;direction:ltr;unicode-bidi:isolate}
  /* موجات خلفية خفيفة */
  .waves{position:fixed;inset:auto 0 0 0;height:22vh;opacity:.18;pointer-events:none}
  .waves svg{width:200%;height:100%;animation:flow 40s linear infinite}
  @keyframes flow{to{transform:translateX(50%)}}

  #stage{position:absolute;inset:3vh 3vw;display:grid;
    grid-template-rows:auto 1fr auto;gap:2.5vh;transition:transform 4s ease}

  /* الهيدر */
  header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:2vh}
  .brand{display:flex;align-items:center;gap:1.4vw}
  .brand img{height:9vh;width:auto;display:block}
  .brand .mark{width:7vh;height:7vh;border-radius:50%;
    background:conic-gradient(from 200deg,var(--brand2),var(--brand),var(--accent),var(--brand2));
    display:grid;place-items:center}
  .brand .mark::after{content:"";width:3vh;height:4vh;background:#fff;opacity:.92;
    border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform:rotate(180deg)}
  .brand h1{font-size:3.4vh;font-weight:700;line-height:1.2}
  .brand h2{font-size:2.1vh;font-weight:400;color:var(--muted)}
  .weather{display:flex;align-items:center;gap:1.2vw;text-align:left}
  .weather .t{font-size:7vh;font-weight:300;font-family:Inter}
  .weather .d{font-size:2vh;color:var(--muted);line-height:1.5;text-align:right}
  .weather .ic{font-size:6vh}

  /* المنتصف */
  main{display:grid;grid-template-columns:1.1fr 1fr;gap:3vw;align-items:center}
  .clock{font-family:Inter;font-weight:300;font-size:19vh;line-height:1;letter-spacing:-.02em;direction:ltr;text-align:right}
  .clock small{font-size:5vh;color:var(--muted);margin-inline-start:1vw}
  .dates{margin-top:2vh;display:grid;gap:1vh}
  .dates .row{display:flex;justify-content:space-between;gap:2vw;font-size:3vh;border-top:1px solid var(--line);padding-top:1vh}
  .dates .row .en{color:var(--muted)}
  .dates .row.big{font-size:3.6vh;font-weight:600;border:0;padding:0}

  .feature{background:linear-gradient(135deg,rgba(0,166,200,.22),rgba(10,94,168,.18));
    border:1px solid rgba(0,166,200,.35);border-radius:3vh;padding:4vh 3vw;text-align:center}
  .feature .lbl{color:var(--muted);font-size:2.4vh}
  .feature .num{font-size:20vh;font-weight:700;line-height:1;margin:1vh 0;
    background:linear-gradient(180deg,#fff,var(--brand2));-webkit-background-clip:text;color:transparent}
  .feature .unit{font-size:3vh}
  .feature .name{font-size:4.4vh;font-weight:700;margin-top:1.5vh}
  .feature .nameEn{font-size:2.6vh;color:var(--muted)}
  .feature .when{font-size:2.2vh;color:var(--accent);margin-top:1vh}

  /* شريط الأحداث */
  .events{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2vw}
  .ev{background:var(--card);border:1px solid var(--line);border-radius:2vh;padding:2vh 1.2vw;
    display:flex;flex-direction:column;gap:.6vh;min-height:17vh}
  .ev .tag{font-size:1.6vh;padding:.3vh .8vw;border-radius:2vh;align-self:flex-start}
  .tag.rel{background:rgba(60,198,164,.18);color:#7fe3c8}
  .tag.wq{background:rgba(0,166,200,.2);color:#8fe2f5}
  .tag.nat{background:rgba(120,200,90,.18);color:#b5e79a}
  .tag.sch{background:rgba(255,190,90,.18);color:#ffd28f}
  .ev .n{font-size:5.4vh;font-weight:700;line-height:1}
  .ev .n span{font-size:2vh;font-weight:400;color:var(--muted);margin-inline-start:.4vw}
  .ev .t1{font-size:2.3vh;font-weight:600}
  .ev .t2{font-size:1.7vh;color:var(--muted)}
  .ev .dt{font-size:1.6vh;color:var(--muted);margin-top:auto}
  .today{color:var(--accent)!important}

  /* مشغّل القرآن */
  .quran{display:flex;align-items:center;gap:1vw;padding:1vh 1.6vw;border-radius:5vh;
    border:1px solid var(--line);background:var(--card);font-size:2.2vh;color:var(--muted);transition:.3s}
  .quran.on{color:var(--text);border-color:rgba(3,168,139,.6);background:rgba(3,168,139,.15)}
  .quran .bars{display:flex;gap:.25vw;align-items:flex-end;height:2.4vh}
  .quran .bars i{width:.35vw;min-width:3px;height:30%;background:var(--accent);border-radius:2px}
  .quran.on .bars i{animation:eq 1s ease-in-out infinite}
  .quran.on .bars i:nth-child(2){animation-delay:.2s}.quran.on .bars i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:25%}50%{height:100%}}
  .quran .hint{font-size:1.6vh;opacity:.7}

  /* بطاقة رسالة اليوم */
  .clock{font-size:15vh!important}
  .dcard{margin-top:2.2vh;border-radius:2.4vh;padding:2vh 1.8vw;
    background:linear-gradient(135deg,rgba(3,168,139,.16),rgba(0,113,187,.14));border:1px solid rgba(3,168,139,.35)}
  .dcard .top{display:flex;align-items:center;gap:.8vw;font-size:1.8vh;color:var(--muted);margin-bottom:1vh}
  .dcard .top b{color:var(--accent);font-weight:700;font-size:2vh}
  .dcard .top .tg{padding:.2vh .8vw;border-radius:2vh;background:rgba(255,255,255,.08)}
  .dcard .top .no{margin-inline-start:auto;font-family:Inter;direction:ltr;unicode-bidi:isolate}
  .dcard .ttl{font-size:2.6vh;font-weight:800;color:var(--accent)}
  .dcard .ayah{font-size:3vh;font-weight:700;line-height:1.5}
  .dcard .ref{font-size:1.7vh;color:var(--muted);margin-bottom:.6vh}
  .dcard .msg{font-size:2.8vh;font-weight:700;line-height:1.45}
  .dcard .ayah + .ref + .msg, .dcard .ttl + .msg{font-size:2.4vh;font-weight:400}

  /* لوحة الصلاة */
  .pray{background:linear-gradient(135deg,rgba(0,167,226,.20),rgba(0,113,187,.16));
    border:1px solid rgba(0,167,226,.35);border-radius:3vh;padding:3vh 2.4vw;display:flex;flex-direction:column;gap:1.2vh;transition:.5s}
  .pray.iqama{background:linear-gradient(135deg,rgba(3,168,139,.28),rgba(0,113,187,.14));border-color:rgba(3,168,139,.6)}
  .pray .lbl{display:flex;justify-content:space-between;color:var(--muted);font-size:2.3vh}
  .pray .nm{display:flex;align-items:baseline;gap:1.2vw}
  .pray .nm b{font-size:7vh;font-weight:800;line-height:1.1}
  .pray .nm span{font-size:2.6vh;color:var(--muted)}
  .pray .cd{font-family:Inter;font-weight:300;font-size:11vh;line-height:1;direction:ltr;text-align:right;
    background:linear-gradient(180deg,#fff,var(--brand2));-webkit-background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
  .pray.iqama .cd{background:linear-gradient(180deg,#fff,var(--accent));-webkit-background-clip:text}
  .pray .sub{font-size:2.3vh;color:var(--text)}
  .pray .sub em{font-style:normal;color:var(--accent)}
  .strip{display:grid;grid-template-columns:repeat(6,1fr);gap:.6vw;margin-top:1vh;border-top:1px solid var(--line);padding-top:1.6vh}
  .strip div{text-align:center;padding:1vh .3vw;border-radius:1.4vh}
  .strip div i{display:block;font-style:normal;font-size:1.8vh;color:var(--muted)}
  .strip div s{display:block;text-decoration:none;font-family:Inter;font-size:2.4vh;font-weight:600;direction:ltr}
  .strip .past{opacity:.4}
  .strip .next{background:rgba(255,255,255,.12);outline:1px solid rgba(0,167,226,.6)}
  .strip .next i{color:var(--text)}
</style>
</head>

/* ================= أدوات ================= */
const $ = id => document.getElementById(id);
const DAY = 864e5;
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const hParts = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"numeric",year:"numeric"});
function hijri(d){const p={};hParts.formatToParts(d).forEach(x=>p[x.type]=x.value);return {y:+p.year,m:+p.month,d:+p.day};}
const arNum = n => String(n);

/* يوم الجودة العالمي = ثاني خميس من نوفمبر */
function qualityDay(y){const d=new Date(y,10,1);while(d.getDay()!==4)d.setDate(d.getDate()+1);d.setDate(d.getDate()+7);return d;}

function buildEvents(){
  const today = midnight(new Date());
  const list = [];
  const y = today.getFullYear();
  // يوم الجودة
  let q = qualityDay(y); if(q<today) q = qualityDay(y+1);
  list.push({ar:"يوم الجودة العالمي", en:"World Quality Day", date:q, cat:"wq"});
  // الثابتة
  FIXED.forEach(e=>{let d=new Date(y,e.m-1,e.d); if(d<today) d=new Date(y+1,e.m-1,e.d); list.push({...e,date:d});});
  // الهجرية: مسح 400 يوم قادمة
  const found = {};
  for(let i=0;i<400;i++){
    const d = new Date(today.getTime()+i*DAY+12*3600e3); const h = hijri(d);
    HIJRI.forEach((e,k)=>{ if(!found[k] && h.m===e.hm && h.d===e.hd){found[k]=1; list.push({...e,date:midnight(d)});} });
  }
  // المدارس
  SCHOOL.forEach(e=>{const [a,b,c]=e.date.split("-").map(Number); const d=new Date(a,b-1,c); if(d>=today) list.push({...e,date:d});});
  list.forEach(e=>e.days=Math.round((e.date-today)/DAY));
  return list.sort((a,b)=>a.days-b.days);
}

const gAr=(d,yr=true)=>`${d.getDate()} ${GM_AR[d.getMonth()]}${yr?" "+d.getFullYear():""}`;
const fmtGregAr={format:d=>gAr(d)}; const fmtShortAr={format:d=>gAr(d,false)};

function renderEvents(){

    <div class="ev">

const CARD_START = new Date(2026,10,5);
const esc = s => s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function renderCard(){
  const days = Math.round((midnight(new Date()) - CARD_START)/DAY);
  const [n,cat,t] = DAILY[((days % DAILY.length)+DAILY.length) % DAILY.length];
  let body;
  if(t.length>=3)      body = `<div class="ayah">${esc(t[0])}</div><div class="ref">${esc(t[1])}</div><div class="msg">${esc(t.slice(2).join(" "))}</div>`;
  else if(t.length==2) body = `<div class="ttl">${esc(t[0])}</div><div class="msg">${esc(t[1])}</div>`;
  else                 body = `<div class="msg">${esc(t[0])}</div>`;

/* ================= مواقيت الصلاة (أم القرى) ================= */
/* الإقامة بعد الأذان بالدقائق — عدّلها حسب مسجدكم */
const IQAMA = {fajr:25, dhuhr:20, asr:20, maghrib:10, isha:20};
const ADJ   = {fajr:0, sunrise:0, dhuhr:0, asr:0, maghrib:0, isha:0};   // تصحيح يدوي بالدقائق إن لزم
const P_AR = {fajr:"الفجر", sunrise:"الشروق", dhuhr:"الظهر", asr:"العصر", maghrib:"المغرب", isha:"العشاء"};
const P_EN = {fajr:"Fajr", sunrise:"Sunrise", dhuhr:"Dhuhr", asr:"Asr", maghrib:"Maghrib", isha:"Isha"};
function prayerTimes(date, lat, lng, tz){
  const rad=Math.PI/180, deg=180/Math.PI;
  const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
  let Y=y,M=m; if(M<=2){Y-=1;M+=12;}
  const Aa=Math.floor(Y/100), B=2-Aa+Math.floor(Aa/4);
  const jDate=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+d+B-1524.5 - lng/(15*24);
  function sun(jd){
    const D=jd-2451545.0, g=(357.529+0.98560028*D)%360, q=(280.459+0.98564736*D)%360;
    const L=(q+1.915*Math.sin(g*rad)+0.020*Math.sin(2*g*rad))%360, e=23.439-0.00000036*D;
    let RA=Math.atan2(Math.cos(e*rad)*Math.sin(L*rad),Math.cos(L*rad))*deg/15; RA=(RA%24+24)%24;
    const decl=Math.asin(Math.sin(e*rad)*Math.sin(L*rad))*deg;
    let eqt=q/15-RA; eqt=((eqt+12)%24+24)%24-12; return {decl,eqt};
  }
  const noonAt=t=>{const s=sun(jDate+t/24);return 12-s.eqt;};
  const angleTime=(alt,t,dir)=>{const s=sun(jDate+t/24);const n=12-s.eqt;
    const h=Math.acos((Math.sin(alt*rad)-Math.sin(s.decl*rad)*Math.sin(lat*rad))/(Math.cos(s.decl*rad)*Math.cos(lat*rad)))*deg/15;
    return n+dir*h;};
  const asrAlt=t=>{const s=sun(jDate+t/24);return Math.atan(1/(1+Math.tan(Math.abs(lat-s.decl)*rad)))*deg;};
  let t={fajr:5,sunrise:6,dhuhr:12,asr:13,maghrib:18};
  for(let i=0;i<2;i++){t={fajr:angleTime(-18.5,t.fajr,-1),sunrise:angleTime(-0.833,t.sunrise,-1),dhuhr:noonAt(t.dhuhr),asr:angleTime(asrAlt(t.asr),t.asr,1),maghrib:angleTime(-0.833,t.maghrib,1)};}
  const adj=tz-lng/15; const r={};for(const k in t) r[k]=t[k]+adj;
  r.isha=r.maghrib+1.5; return r;
}

function dayTimes(day){   // تواريخ فعلية لكل وقت في يوم معيّن
  const p = prayerTimes(day, LAT, LON, 3);
  if(hijri(day).m===9) p.isha = p.maghrib + 2;        // رمضان: العشاء بعد المغرب بساعتين
  const out={};
  for(const k of ["fajr","sunrise","dhuhr","asr","maghrib","isha"])
    out[k] = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, Math.round(p[k]*60) + ADJ[k]);
  return out;
}
const hm = d => { let h=d.getHours()%12||12; return h+":"+String(d.getMinutes()).padStart(2,"0"); };
const ap = d => d.getHours()<12 ? "AM" : "PM";
function cdStr(ms){ const s=Math.max(0,Math.ceil(ms/1000)), H=Math.floor(s/3600), M=Math.floor(s%3600/60), S=s%60;
  return (H? H+":"+String(M).padStart(2,"0") : String(M)) + ":" + String(S).padStart(2,"0"); }
function renderPrayer(){
  const now=new Date(), today=midnight(now);
  const T=dayTimes(today);
  const order=["fajr","dhuhr","asr","maghrib","isha"];
  let cur=null, dayRef=T, phase="adhan";
  for(const k of order){
    const iq=new Date(T[k].getTime()+IQAMA[k]*60000);
    if(now < T[k]){ cur=k; phase="adhan"; break; }
    if(now < iq){ cur=k; phase="iqama"; break; }
  }
  if(!cur){ dayRef=dayTimes(new Date(today.getTime()+DAY+3600e3)); cur="fajr"; phase="adhan"; }
  const isFri = (cur==="dhuhr" && now.getDay()===5);
  const name = isFri ? "الجمعة" : P_AR[cur], nameEn = isFri ? "Jumu'ah" : P_EN[cur];
  const adhan = dayRef[cur], iqama = new Date(adhan.getTime()+IQAMA[cur]*60000);
  const target = phase==="adhan" ? adhan : iqama;
  $("pray").classList.toggle("iqama", phase==="iqama");
  const strip = ["fajr","sunrise","dhuhr","asr","maghrib","isha"].map(k=>{
    const t=T[k], cls = (k===cur && dayRef===T) ? "next" : (t<now && !(k===cur) ? "past" : "");
    const nm = (k==="dhuhr" && now.getDay()===5) ? "الجمعة" : P_AR[k];
    return `<div class="${cls}"><i>${nm}</i><s>${hm(t)}</s></div>`;
  }).join("");
  $("pray").innerHTML = `
    <div class="lbl"><span>${phase==="adhan" ? "الصلاة القادمة" : "حان وقت الصلاة"}</span><span class="en">${phase==="adhan"?"Next prayer":"Prayer time"}</span></div>
    <div class="nm"><b>${name}</b><span class="en">${nameEn}</span></div>
    <div class="lbl" style="font-size:2.6vh;color:var(--text)"><span>${phase==="adhan" ? "متبقي للأذان" : "متبقي للإقامة"}</span><span class="en" style="color:var(--muted)">${phase==="adhan"?"Until Adhan":"Until Iqama"}</span></div>
    <div class="cd">${cdStr(target-now)}</div>
    <div class="sub">الأذان <em class="en">${hm(adhan)} ${ap(adhan)}</em> · الإقامة <em class="en">${hm(iqama)} ${ap(iqama)}</em></div>
    <div class="strip">${strip}</div>`;
}


/* ================= الأذان ================= */
/* ملفات الصوت توضع بجانب الصفحة على التلفزيون: adhan.mp3 (وadhan_fajr.mp3 للفجر إن وُجد) */
const ADHAN_ON = true;
const adh = new Audio(); adh.preload = "auto";
let adhanBusy = false, adhanPrayer = null, quranWasOn = false;
function playAdhan(k){
  adhanBusy = true; adhanPrayer = k;
  quranWasOn = qWant ? "yt" : (fajrMode && !qa.paused ? "mp3" : false);
  if(quranWasOn==="yt" && ytReady) yt.pauseVideo(); if(quranWasOn==="mp3") qa.pause();
  adh.src = (k==="fajr") ? "adhan_fajr.mp3" : "adhan.mp3";
  adh.play().catch(()=>adhanDone());
}
function adhanDone(){
  const k = adhanPrayer; adhanBusy = false; adhanPrayer = null;
  if(k==="fajr" && !fajrMode && ls.get("fajrDone","")!==new Date().toDateString()){ ls.set("fajrDone",new Date().toDateString()); fajrStart(); return; }
  if(quranWasOn==="yt" && qWant && ytReady) yt.playVideo(); if(quranWasOn==="mp3" && fajrMode) qa.play().catch(()=>{});
}
adh.addEventListener("ended", adhanDone);
adh.addEventListener("error", ()=>{ if(adh.src.includes("adhan_fajr")){ adh.src="adhan.mp3"; adh.play().catch(()=>adhanDone()); } else adhanDone(); });
function adhanCheck(){
  if(!ADHAN_ON || adhanBusy) return;
  const now=new Date(), T=dayTimes(midnight(now)), key=now.toDateString();
  for(const k of ["fajr","dhuhr","asr","maghrib","isha"]){
    const diff = now - T[k];
    if(diff>=0 && diff<120000 && ls.get("adhan_"+k,"")!==key){ ls.set("adhan_"+k,key); playAdhan(k); break; }
  }
}

/* ================= الساعة والتاريخ ================= */
function tick(){
  const d = new Date();
  let h = d.getHours(), m = String(d.getMinutes()).padStart(2,"0");
  const ap = h<12 ? "AM" : "PM"; h = h%12 || 12;
  $("clock").firstChild.nodeValue = `${h}:${m}`;
  $("ampm").textContent = ap;
  const hj=hijri(d);
  $("dayAr").textContent = WD_AR[d.getDay()];
  $("dayEn").textContent = WD_EN[d.getDay()];
  $("hijriAr").textContent = `${hj.d} ${HM_AR[hj.m-1]} ${hj.y} هـ`;
  $("hijriEn").textContent = `${HM_EN[hj.m-1]} ${hj.d}, ${hj.y} AH`;
  $("gregAr").textContent = gAr(d);
  $("gregEn").textContent = `${d.getDate()} ${GM_EN[d.getMonth()]} ${d.getFullYear()}`;
}

/* ================= الطقس (Open-Meteo، بدون مفتاح) ================= */
const WMO = {0:["☀️","صحو","Clear"],1:["🌤️","صحو غالباً","Mostly clear"],2:["⛅","غائم جزئياً","Partly cloudy"],3:["☁️","غائم","Overcast"],
  45:["🌫️","ضباب","Fog"],48:["🌫️","ضباب","Fog"],51:["🌦️","رذاذ","Drizzle"],53:["🌦️","رذاذ","Drizzle"],55:["🌦️","رذاذ","Drizzle"],
  61:["🌧️","مطر خفيف","Light rain"],63:["🌧️","مطر","Rain"],65:["🌧️","مطر غزير","Heavy rain"],80:["🌦️","زخات","Showers"],
  81:["🌧️","زخات","Showers"],82:["⛈️","زخات غزيرة","Heavy showers"],95:["⛈️","عاصفة رعدية","Thunderstorm"],96:["⛈️","عاصفة رعدية","Thunderstorm"],99:["⛈️","عاصفة رعدية","Thunderstorm"]};
function showWeather(t,code,hi,lo,src){
  const w = WMO[code] || ["🌡️","",""];
  $("wTemp").textContent = Math.round(t) + "°";
  $("wIcon").textContent = w[0];
  $("wDesc").textContent = w[1] ? `${w[1]} · ${w[2]}` : "";
  $("wMinMax").textContent = (hi!=null) ? `H ${Math.round(hi)}°  ·  L ${Math.round(lo)}°` : "";
}
/* wttr.in codes -> أقرب رمز WMO */
function wttrToWmo(c){c=+c;if(c===113)return 0;if(c===116)return 2;if(c===119||c===122)return 3;if(c===143||c===248||c===260)return 45;
  if([176,263,266,293,296,353].includes(c))return 61;if([299,302,305,308,356,359].includes(c))return 63;if([200,386,389].includes(c))return 95;return 3;}
async function weather(){
  const ctl = () => { const a=new AbortController(); setTimeout(()=>a.abort(),10000); return a.signal; };
  try{
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FRiyadh&forecast_days=1`,{signal:ctl()});
    if(!r.ok) throw 0;
    const j = await r.json();
    const v = {t:j.current.temperature_2m, c:j.current.weather_code, hi:j.daily.temperature_2m_max[0], lo:j.daily.temperature_2m_min[0]};
    showWeather(v.t,v.c,v.hi,v.lo); try{localStorage.setItem("wx",JSON.stringify({...v,at:Date.now()}))}catch(e){}
    return;
  }catch(e){}
  try{
    const r = await fetch(`https://wttr.in/${LAT},${LON}?format=j1`,{signal:ctl()});
    if(!r.ok) throw 0;
    const j = await r.json(); const c=j.current_condition[0], d=j.weather[0];
    const v = {t:+c.temp_C, c:wttrToWmo(c.weatherCode), hi:+d.maxtempC, lo:+d.mintempC};
    showWeather(v.t,v.c,v.hi,v.lo); try{localStorage.setItem("wx",JSON.stringify({...v,at:Date.now()}))}catch(e){}
    return;
  }catch(e){}
  // آخر قراءة محفوظة (أقل من 6 ساعات)
  try{ const v=JSON.parse(localStorage.getItem("wx")); if(v && Date.now()-v.at<6*3600e3){ showWeather(v.t,v.c,v.hi,v.lo); return; } }catch(e){}
  $("wTemp").textContent = ""; $("wIcon").textContent = ""; $("wDesc").textContent = "الطقس غير متاح — تحقق من الإنترنت";
  setTimeout(weather, 60*1000); // إعادة المحاولة بعد دقيقة
}

const FAJR_PLAN = { reciter:"ماهر المعيقلي", url:"https://server12.mp3quran.net/maher/", sura:2, window:20 }; // يبدأ خلال 20 دقيقة من الأذان
function fajrTime(date, lat, lng, tz, angle){
  const rad=Math.PI/180, deg=180/Math.PI;
  const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
  const A=Math.floor((14-m)/12), Y=y+4800-A, M=m+12*A-3;
  const JD=d+Math.floor((153*M+2)/5)+365*Y+Math.floor(Y/4)-Math.floor(Y/100)+Math.floor(Y/400)-32045 - lng/360; // JDN at noon approx
  const D=JD-2451545.0;
  const g=(357.529+0.98560028*D)%360, q=(280.459+0.98564736*D)%360;
  const L=(q+1.915*Math.sin(g*rad)+0.020*Math.sin(2*g*rad))%360;
  const e=23.439-0.00000036*D;
  let RA=Math.atan2(Math.cos(e*rad)*Math.sin(L*rad),Math.cos(L*rad))*deg/15; RA=(RA+24)%24;
  const decl=Math.asin(Math.sin(e*rad)*Math.sin(L*rad))*deg;
  let EqT=q/15-RA; EqT=((EqT+12)%24+24)%24-12;
  const noon=12+tz-lng/15-EqT;
  const T=Math.acos((-Math.sin(angle*rad)-Math.sin(decl*rad)*Math.sin(lat*rad))/(Math.cos(decl*rad)*Math.cos(lat*rad)))*deg/15;
  return noon-T;
}

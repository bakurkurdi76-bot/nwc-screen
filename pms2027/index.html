<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة الأداء 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--pri:#0b3c6e;--acc:#00a3e0;--bg:#f3f6f9;--card:#fff;--ink:#17202a;--mut:#5f6b7a;--line:#e3e8ee;--ok:#1f9d6b;--warn:#d98a00;--bad:#c8402f;--r:12px}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:14px}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--pri);color:#fff;font-weight:700}
button.sec{background:#fff;color:var(--pri);border:1px solid var(--line)}
button.ghost{background:transparent;color:var(--pri);padding:4px 8px}
button.ok{background:var(--ok)}button.bad{background:var(--bad)}button.sm{padding:4px 10px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px;font-weight:500}
h1,h2,h3,h4{margin:0 0 8px;line-height:1.3}
.muted{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:900px){.g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;border-top:4px solid var(--acc)}
.tile .v{font-size:26px;font-weight:800;color:var(--pri)}.tile .k{font-size:13px;color:var(--mut)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eef2f6;color:var(--mut);white-space:nowrap}
.p-ok{background:#e3f5ec;color:var(--ok)}.p-warn{background:#fff3dc;color:#9a6200}.p-bad{background:#fde8e5;color:var(--bad)}.p-pri{background:color-mix(in srgb,var(--acc) 15%,#fff);color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{background:#f7f9fb;font-weight:700;color:var(--mut);font-size:13px}
tr.click:hover{background:#f7fafc;cursor:pointer}
/* picker */
.pick{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;background:linear-gradient(160deg,#eef3f8,#f9fbfc)}
.pick h1{font-size:30px;color:#0f2a44}.cos{display:grid;grid-template-columns:repeat(3,minmax(200px,260px));gap:18px;margin-top:26px}
@media(max-width:760px){.cos{grid-template-columns:1fr}}
.co{background:#fff;border-radius:16px;border:1px solid var(--line);padding:26px 18px;text-align:center;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.co:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(15,42,68,.12)}
.co .band{position:absolute;inset:0 0 auto 0;height:7px}
.mono{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24px;margin:6px auto 12px}
.logo{height:96px;max-width:200px;object-fit:contain;margin:6px auto 12px;display:block}
.wordmark{height:96px;margin:6px auto 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px;border:3px solid;border-radius:14px;width:180px;line-height:1.2}.wordmark span{font-size:12px;letter-spacing:1px;font-weight:700}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 55%,var(--acc)));padding:20px}
.login .box{background:#fff;border-radius:18px;padding:30px;width:min(440px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
/* shell */
.top{background:var(--pri);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.top .brand{display:flex;align-items:center;gap:10px;font-weight:800}
.top .mono{width:38px;height:38px;font-size:15px;margin:0;border-radius:10px;background:var(--acc)}
.top select{width:auto;padding:5px 8px;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.top select option{color:#000}
.top .sp{flex:1}
.sim{background:#fff3dc;color:#7a4b00;padding:6px 18px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lay{display:flex;min-height:calc(100vh - 58px)}
.side{width:230px;background:#fff;border-left:1px solid var(--line);padding:14px 10px;flex-shrink:0}
.side a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;cursor:pointer;margin-bottom:2px}
.side a:hover{background:#f2f5f8}.side a.on{background:color-mix(in srgb,var(--acc) 14%,#fff);color:var(--pri);font-weight:800}
.side .sec{font-size:12px;color:var(--mut);margin:14px 12px 4px;font-weight:700}
.main{flex:1;padding:20px;min-width:0}
@media(max-width:800px){.lay{flex-direction:column}.side{width:auto;border-left:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px}.side .sec{display:none}}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:14px 0}
.tabs a{padding:8px 14px;cursor:pointer;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs a.on{color:var(--pri);border-color:var(--acc)}
.goal{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:14px;overflow:hidden}
.goal .gh{padding:12px 14px;background:color-mix(in srgb,var(--acc) 7%,#fff);border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:11px;padding:2px 7px;border-radius:6px;cursor:pointer;border:1px solid transparent;font-weight:700;white-space:nowrap}
.c-up{background:#f1f3f5;color:#98a2ad}.c-open{background:var(--acc);color:#fff;animation:pulse 1.6s infinite}.c-sub{background:#fff3dc;color:#9a6200;border-color:#f3cf86}
.c-ok{background:#e3f5ec;color:var(--ok)}.c-ret{background:#fde8e5;color:var(--bad);border-color:#f2b5ab}.c-miss{background:#fbeceb;color:#a33;text-decoration:line-through}.c-pend{background:#eef2f6;color:var(--mut)}
@keyframes pulse{50%{opacity:.7}}
.bar{height:8px;background:#edf1f5;border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
.modal{background:#fff;border-radius:14px;width:min(860px,100%);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.toast{position:fixed;bottom:18px;left:18px;background:#17202a;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-weight:700}
.note{background:#f4f8fc;border:1px dashed color-mix(in srgb,var(--acc) 50%,#ccc);border-radius:10px;padding:10px 12px;font-size:13px}
.warnbox{background:#fff7e6;border:1px solid #f3cf86;border-radius:10px;padding:10px 12px;font-size:13px;color:#7a4b00}
.errbox{background:#fdeceb;border:1px solid #f2b5ab;border-radius:10px;padding:10px 12px;font-size:13px;color:#8d2a1d}
.r5{background:#1f9d6b;color:#fff}.r4{background:#5cb88a;color:#fff}.r3{background:#4a7fb5;color:#fff}.r2{background:#e0a030;color:#fff}.r1{background:#c8402f;color:#fff}
.rbig{font-size:34px;font-weight:800;border-radius:12px;width:62px;height:62px;display:flex;align-items:center;justify-content:center}
.sub-t td{font-size:13px}
.ev a{color:var(--pri)}
.hr{height:1px;background:var(--line);margin:14px 0}
</style>
</head>

/* =================== أدوات =================== */
const pad=n=>String(n).padStart(2,'0');
const toD=s=>new Date(s+'T00:00:00Z');
const fmt=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return fmt(d)};
const lastDay=(y,m)=>fmt(new Date(Date.UTC(y,m,0)));
const realToday=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const today=()=>state.settings.simDate||realToday();
const nid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdate=s=>{if(!s)return '—';const [y,m,d]=s.split('-');return `${+d} ${MONTHS[+m-1]} ${y}`};
const sdate=s=>{if(!s)return '';const [y,m,d]=s.split('-');return `${+d}/${+m}`};
const r1=x=>x==null?null:Math.round(x*10)/10;
const pctTxt=x=>x==null?'—':r1(x)+'%';
const nowTs=()=>new Date().toISOString();
function $(id){return document.getElementById(id)}
function val(id){const e=$(id);return e?e.value.trim():''}

/* =================== الحالة والتخزين =================== */
const KEY='nwc_pms_2027_v1';
let state=null;
let S={company:null,userId:null,view:'home',param:null,tab:'goals',allCo:false,q:''};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('تعذّر الحفظ في المتصفح (المساحة ممتلئة أو التخزين غير متاح)')}}
function saveSess(){try{sessionStorage.setItem(KEY+'_s',JSON.stringify(S))}catch(e){}}
function load(){
  try{const t=localStorage.getItem(KEY);if(t)state=JSON.parse(t)}catch(e){}
  if(!state)state=makeDemo();
  CO_KEYS.forEach(k=>{const b=state.settings.brands[k];if(!b.logo&&DEFAULT_LOGOS[k])b.logo=DEFAULT_LOGOS[k];if(k==='edico'&&b.en==='EDICO'){Object.assign(b,{name:'شركة أديكو',en:'ADECO',pri:'#2f6f1e',acc:'#e9a800'})}});
  try{const t=sessionStorage.getItem(KEY+'_s');if(t)S=Object.assign(S,JSON.parse(t))}catch(e){}
}
function log(action){const u=me();state.log.unshift({ts:nowTs(),user:u?u.name:'—',action});if(state.log.length>800)state.log.length=800}

/* =================== المستخدمون والصلاحيات =================== */
const U=id=>state.users.find(u=>u.id===id);
const byEmail=e=>state.users.find(u=>u.email.toLowerCase()===String(e||'').trim().toLowerCase());
const me=()=>S.userId?U(S.userId):null;
function managerOf(u){return u&&u.manager?byEmail(u.manager):null}
function isAncestor(a,t){let m=managerOf(t),g=0;while(m&&g<25){if(m.id===a.id)return true;m=managerOf(m);g++}return false}
function canView(v,t){
  if(!v||!t)return false; if(v.id===t.id)return true;
  if(v.role==='admin'||v.role==='delegate')return true;
  if(v.role==='contract_manager'&&v.company===t.company)return true;
  if(isAncestor(v,t))return true;
  if(t.company!==v.company&&v.companies.includes(t.company))return true; // إشراف على عقد شركة أخرى
  return false;
}
function canManage(v,t){
  if(!v||!t||v.id===t.id)return false;
  if(v.role==='admin'||v.role==='delegate')return true;
  if(v.role==='contract_manager'&&v.company===t.company)return true;
  return isAncestor(v,t);
}
function canReview(v,t){return canManage(v,t)||(v&&t&&v.id===t.id&&v.role==='admin'&&!managerOf(t))}
function canEditGoals(v,t){return canManage(v,t)||(v.id===t.id&&(!meta(t.id).locked||v.role==='admin'))}
function scopeUsers(v,co){return state.users.filter(t=>t.id!==v.id&&t.active!==false&&(co==='all'||t.company===co)&&canView(v,t))}
function reviewables(v){return state.users.filter(t=>t.active!==false&&canReview(v,t))}
function meta(uid){if(!state.goalMeta[uid])state.goalMeta[uid]={locked:false,changes:[]};return state.goalMeta[uid]}
function brand(co){return state.settings.brands[co]}
function stratList(co){return co==='nwc'?state.lists.strat:state.lists.dept}
function stratName(co,code){const f=stratList(co).find(x=>x[0]===code);return f?f[0]+' '+f[1]:code||''}
function initName(code){const f=state.lists.init.find(x=>x[0]===code);return f?f[0]+' — '+f[1]:code||''}

/* =================== الفترات ونوافذ الرفع =================== */
function periodsFor(s){
  const st=state.settings,cs=st.cycleStart,ce=st.cycleEnd,W=st.windows,out=[];
  const push=(key,label,start,end,win,open)=>out.push({key,label,start,end,winOpen:open||addDays(end,1),winClose:addDays(end,win)});
  const months=[];{let y=+cs.slice(0,4),m=+cs.slice(5,7);for(let i=0;i<24;i++){const a=`${y}-${pad(m)}-01`;if(a>ce)break;months.push([y,m]);m++;if(m>12){m=1;y++}}}
  if(s.freq==='monthly'){months.forEach(([y,m])=>{let e=lastDay(y,m);if(e>ce)e=ce;push(`M${y}${pad(m)}`,`${MONTHS[m-1]} ${y}`,`${y}-${pad(m)}-01`,e,W.monthly)})}
  else if(s.freq==='weekly'){let d=toD(cs);d.setUTCDate(d.getUTCDate()-d.getUTCDay());let a=fmt(d),i=1;while(a<=ce){let e=addDays(a,6);if(e>ce)e=ce;push('W'+i,`أسبوع ${i} (${sdate(a<cs?cs:a)}–${sdate(e)})`,a<cs?cs:a,e,W.weekly);a=addDays(a,7);i++}}

function subCalc(s,asOf){

}
function drawSubs(){
  $('subs').innerHTML=draftSubs.map((x,i)=>`<div class="card" style="margin-bottom:8px;padding:10px"><div class="grid g3">
   <div><label>الهدف الفرعي / الالتزام</label><input value="${esc(x.title)}" oninput="App.subSet(${i},'title',this.value)"></div>

     ${x.freq==='once'?`<div style="flex:1"><label>موعد التسليم</label><input type="date" value="${esc(x.due)}" min="${state.settings.cycleStart}" max="${state.settings.cycleEnd}" onchange="App.subSet(${i},'due',this.value)"></div>`:''}</div>
   <div class="row" style="gap:6px"><div style="flex:1"><label>الوزن (%)</label><input type="number" step="0.5" value="${esc(x.weight)}" oninput="App.subSet(${i},'weight',this.value);App.subSum()"></div><button class="ghost" style="margin-top:22px;color:var(--bad)" onclick="App.subDel(${i})">حذف</button></div>
  </div></div>`).join('');subSum();
}
function subSum(){const s=draftSubs.reduce((a,x)=>a+(+x.weight||0),0),w=+val('g_w')||0,e=$('subsum');if(e){e.textContent=`مجموع أوزان الفرعية ${s}% من ${w}%`;e.className='pill '+(Math.abs(s-w)<0.01&&w?'p-ok':'p-bad')}}
function goalSave(uid,gid){
  const v=me(),t=U(uid),title=val('g_t'),w=+val('g_w'),st=val('g_s'),ini=$('g_i')?val('g_i'):'',err=[];
  if(!title)err.push('اكتب عنوان الهدف الرئيسي');if(!(w>0))err.push('حدد وزن الهدف');
  draftSubs.forEach((x,i)=>{if(!x.title)err.push(`الهدف الفرعي ${i+1}: العنوان مطلوب`);if(!(+x.weight>0))err.push(`الهدف الفرعي ${i+1}: الوزن مطلوب`);if(x.freq==='once'&&!x.due)err.push(`الهدف الفرعي ${i+1}: موعد التسليم مطلوب`)});
  const s=draftSubs.reduce((a,x)=>a+(+x.weight||0),0);if(Math.abs(s-w)>0.01)err.push(`مجموع أوزان الأهداف الفرعية (${s}%) يجب أن يساوي وزن الهدف الرئيسي (${w}%)`);
  const others=goalsOf(uid).filter(g=>g.id!==gid).reduce((a,g)=>a+(+g.weight||0),0);if(others+w>100)err.push(`مجموع أوزان الأهداف الرئيسية سيصبح ${others+w}% (الحد 100%)`);
  if(!st)err.push('اختر الربط الاستراتيجي');
  const locked=meta(uid).locked,reason=locked?val('g_r'):'';if(locked&&!reason)err.push('سبب التعديل إلزامي لأن الأهداف معتمدة');
  if(err.length){$('gerr').innerHTML=`<div class="errbox">${err.map(esc).join('<br>')}</div>`;return}
  const subs=draftSubs.map(({_r,...x})=>({...x,weight:+x.weight}));
  if(gid){const g=state.goals.find(x=>x.id===gid);Object.assign(g,{title,weight:w,strat:st,init:ini,subs})}else state.goals.push({id:nid(),userId:uid,title,weight:w,strat:st,init:ini,subs});
  if(locked)meta(uid).changes.push({ts:nowTs(),by:v.name,reason:`${gid?'تعديل':'إضافة'} «${title}»: ${reason}`});
  log(`${gid?'تعديل':'إضافة'} هدف «${title}» للموظف ${t.name}`);save();closeModal();render();toast('تم الحفظ');
}

/* ---------- نافذة الفترة: رفع / مراجعة ---------- */
function findSub(subId){for(const g of state.goals){const s=g.subs.find(x=>x.id===subId);if(s)return {g,s}}return {}}
function period(subId,pk){
  const {g,s}=findSub(subId);if(!s)return;const t=U(g.userId),v=me(),p=periodsFor(s).find(x=>x.key===pk),w=winState(s,p),hist=updsOf(subId,pk),up=hist[hist.length-1];
  const own=v.id===t.id,canSub=own&&w==='open'&&(!up||up.status==='returned'),rev=canReview(v,t)&&up&&up.status==='submitted';
  let h=`<div class="row between"><h3>${esc(s.title)} — ${esc(p.label)}</h3><button class="ghost" onclick="App.close()">✕</button></div>
   <div class="muted sm">${esc(t.name)} · ${esc(g.title)} · وزن ${s.weight}% · ${FREQ_LBL[s.freq]}</div>
   <div class="grid g3" style="margin:10px 0"><div class="note"><b>الفترة</b><br>${fdate(p.start)} – ${fdate(p.end)}</div><div class="note"><b>نافذة الرفع</b><br>${fdate(p.winOpen)} – ${fdate(closeOf(s,p))}</div><div class="note"><b>المستهدف</b><br>${esc(s.target)}<div class="xs muted">${esc(s.method)}</div></div></div>`;
  if(hist.length)h+=hist.map(u=>updCard(u,v,t)).join('');
  else h+=`<div class="muted sm">لا يوجد رفع لهذه الفترة. ${w==='closed'?'<b style="color:var(--bad)">انتهت النافذة — تُحتسب 0%</b>':''}</div>`;
  if(canSub)h+=`<div class="hr"></div><h4>رفع الإنجاز</h4>
   <label>وصف مختصر للإنجاز</label><textarea id="u_d"></textarea>
   <div class="grid g3"><div><label>القيمة المحققة (اختياري)</label><input id="u_v" placeholder="مثال: 100% من العينات"></div><div><label>نسبة الإنجاز الذاتية (%)</label><input id="u_p" type="number" min="0" max="${state.settings.maxPct}" value="100"></div><div><label>تاريخ التنفيذ</label><input id="u_dt" type="date" value="${p.end<=today()?p.end:today()}"></div></div>
   <label>روابط الشواهد (رابط في كل سطر — يُفضّل رابط OneDrive/SharePoint)</label><textarea id="u_l" style="min-height:50px" placeholder="https://..."></textarea>
   <label>مرفقات (حتى 600 كيلوبايت للملف في النموذج الأولي)</label><input id="u_f" type="file" multiple>
   <div id="uerr"></div><div class="row" style="margin-top:10px"><button onclick="App.submitUpd('${subId}','${pk}')">رفع للمراجعة</button></div>`;
  else if(own&&w==='upcoming')h+=`<div class="note" style="margin-top:10px">يُفتح الرفع في ${fdate(p.winOpen)}.</div>`;
  else if(own&&w==='closed'&&(!up||up.status==='returned'))h+=`<div class="errbox" style="margin-top:10px">انتهت نافذة الرفع. يمكن لمديرك فتح استثناء موثق عند وجود مبرر.</div>`;
  if(rev)h+=`<div class="hr"></div><h4>المراجعة والاعتماد</h4><div class="grid g2"><div><label>نسبة الإنجاز المعتمدة (%)</label><input id="r_p" type="number" min="0" max="${state.settings.maxPct}" value="${up.selfPct}"></div><div></div></div>
   <label>تعليق المدير</label><textarea id="r_c"></textarea><div class="row" style="margin-top:8px"><button class="ok" onclick="App.reviewUpd('${up.id}','approved')">اعتماد</button><button class="bad" onclick="App.reviewUpd('${up.id}','returned')">إعادة للموظف</button></div>`;
  if(canManage(v,t)&&w!=='open'&&p.winClose<today())h+=`<div class="hr"></div><details><summary class="sm" style="cursor:pointer;color:var(--pri);font-weight:700">فتح نافذة استثنائية (موثّق)</summary><div class="grid g2"><div><label>مفتوحة حتى</label><input id="x_u" type="date" value="${addDays(today(),3)}"></div><div><label>السبب</label><input id="x_r"></div></div><button class="sm" style="margin-top:8px" onclick="App.addExc('${subId}','${pk}')">فتح</button></details>`;
  openModal(h);
}
function evList(x){const l=(x.links||[]).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.length>60?u.slice(0,60)+'…':u)}</a>`),f=(x.files||[]).map(f=>f.type&&f.type.startsWith('image/')?`<img src="${f.data}" style="max-height:80px;border-radius:6px;border:1px solid var(--line)" title="${esc(f.name)}">`:`<span class="pill">📎 ${esc(f.name)}</span>`);return l.length||f.length?`<div class="ev sm">${[...l,...f].join(' · ')}</div>`:''}
function updCard(u,v,t){
  const cls={approved:'p-ok',submitted:'p-warn',returned:'p-bad'}[u.status],lbl={approved:'معتمد',submitted:'بانتظار المراجعة',returned:'مُعاد'}[u.status];
  return `<div class="card" style="margin-bottom:8px"><div class="row between"><span class="pill ${cls}">${lbl}${u.status==='approved'?' — '+r1(u.approvedPct)+'%':''}</span><span class="xs muted">رُفع ${fdate(u.ts.slice(0,10))} · ذاتي ${u.selfPct}%</span></div>
   <div style="margin-top:6px">${esc(u.desc)}</div>${u.value?`<div class="sm muted">القيمة: ${esc(u.value)}</div>`:''}<div class="xs muted">تاريخ التنفيذ: ${fdate(u.doneDate)}</div>${evList(u)}
   ${u.mgrComment?`<div class="note" style="margin-top:6px"><b>${esc(u.reviewer||'المدير')}:</b> ${esc(u.mgrComment)}</div>`:''}
   ${(u.comments||[]).map(c=>`<div class="xs" style="margin-top:4px">💬 <b>${esc(c.by)}</b> (${fdate(c.ts.slice(0,10))}): ${esc(c.text)}</div>`).join('')}
   ${canView(v,t)&&v.id!==t.id?`<div class="row" style="margin-top:6px"><input id="cm_${u.id}" placeholder="ملاحظة متابعة..." style="flex:1"><button class="sm sec" onclick="App.comment('${u.id}')">إضافة</button></div>`:''}</div>`;

async function readFiles(inp){const out=[],err=[];for(const f of (inp&&inp.files)||[]){if(f.size>600*1024){err.push(`${f.name}: أكبر من 600 كيلوبايت — استخدم رابط OneDrive`);continue}out.push({name:f.name,type:f.type,data:await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})})}return {out,err}}
async function submitUpd(subId,pk){
  const {g,s}=findSub(subId),d=val('u_d'),p=+val('u_p'),links=val('u_l').split('\n').map(x=>x.trim()).filter(Boolean),{out,err}=await readFiles($('u_f'));

function reviewUpd(id,status){const u=state.updates.find(x=>x.id===id),c=val('r_c'),p=+val('r_p');if(status==='returned'&&!c){toast('اكتب سبب الإعادة');return}
  Object.assign(u,{status,approvedPct:status==='approved'?Math.min(p,state.settings.maxPct):null,mgrComment:c,reviewer:me().name,reviewTs:nowTs()});log(`${status==='approved'?'اعتماد':'إعادة'} إنجاز (${U(u.userId).name})`);save();closeModal();render();toast('تم')}
function comment(id){const u=state.updates.find(x=>x.id===id),t=val('cm_'+id);if(!t)return;(u.comments=u.comments||[]).push({by:me().name,text:t,ts:nowTs()});save();const {s}=findSub(u.subId);period(u.subId,u.periodKey)}

function pendingReviews(v){

   <div><label>فئة التقييم (أوزان الأهداف/الجدارات)</label><select id="us_cat">${Object.keys(CAT_LBL).map(k=>`<option value="${k}" ${u.category===k?'selected':''}>${CAT_LBL[k]} (${state.settings.weights[k].join('/')})</option>`).join('')}</select></div>
   <div><label>المسمى الوظيفي</label><input id="us_t" value="${esc(u.title)}"></div><div><label>القسم / العقد</label><input id="us_s" value="${esc(u.section)}"></div>
   <div><label>المدير المباشر</label><select id="us_m"><option value="">— خارج النظام —</option>${state.users.filter(x=>x.id!==id).map(x=>`<option value="${esc(x.email)}" ${x.email===u.manager?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
   <div><label>الحالة</label><select id="us_a"><option value="1">نشط</option><option value="0" ${u.active===false?'selected':''}>موقوف</option></select></div></div>
   <div id="userr"></div><div class="row" style="margin-top:12px"><button onclick="App.userSave('${id||''}')">حفظ</button><button class="sec" onclick="App.close()">إلغاء</button></div>`);
}
function userSave(id){
  const o={name:val('us_n'),email:val('us_e').toLowerCase(),company:val('us_c'),companies:[...document.querySelectorAll('.us_co:checked')].map(x=>x.value),role:val('us_r'),category:val('us_cat'),title:val('us_t'),section:val('us_s'),manager:val('us_m'),active:val('us_a')==='1'};
  const err=[];if(!o.name)err.push('الاسم مطلوب');if(!/^\S+@\S+\.\S+$/.test(o.email))err.push('بريد غير صحيح');const dup=byEmail(o.email);if(dup&&dup.id!==id)err.push('البريد مسجل لمستخدم آخر');
  if(!o.companies.includes(o.company))o.companies.unshift(o.company);
  if(err.length){$('userr').innerHTML=`<div class="errbox">${err.join('<br>')}</div>`;return}
  if(id){const u=U(id),old=u.email;Object.assign(u,o);if(old!==o.email)state.users.forEach(x=>{if(x.manager===old)x.manager=o.email})}else state.users.push({id:nid(),...o});
  log(`${id?'تعديل':'إضافة'} مستخدم ${o.name}`);save();closeModal();render();toast('تم الحفظ');
}
function importXl(inp){
  const f=inp.files[0];if(!f)return;if(!window.XLSX){toast('مكتبة Excel لم تُحمّل');return}
  const fr=new FileReader();fr.onload=e=>{try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    const pick=(r,k)=>{for(const h of Object.keys(r)){const hh=h.trim().toLowerCase();if(COL_MAP[k].some(c=>c.toLowerCase()===hh))return String(r[h]).trim()}return ''};
    let add=0,upd=0;const errs=[];
    rows.forEach((r,i)=>{const email=pick(r,'email').toLowerCase(),name=pick(r,'name');if(!email||!name){errs.push(`صف ${i+2}: الاسم والبريد مطلوبان`);return}
      const company=coKey(pick(r,'company'));if(!company||company==='all'){errs.push(`صف ${i+2}: شركة غير معروفة`);return}
      let cos=pick(r,'companies').split(/[,،;]/).map(coKey).filter(Boolean);if(cos.includes('all'))cos=[...CO_KEYS];if(!cos.includes(company))cos.unshift(company);cos=[...new Set(cos)];
      const role=roleKey(pick(r,'role')),o={name,email,company,companies:cos,role,title:pick(r,'title'),section:pick(r,'section'),manager:pick(r,'manager').toLowerCase(),category:catKey(pick(r,'category'),role),active:true};
      const ex=byEmail(email);if(ex){Object.assign(ex,o);upd++}else{state.users.push({id:nid(),...o});add++}});
    log(`استيراد Excel: ${add} جديد، ${upd} محدث`);save();render();
    $('imp').innerHTML=`<div class="${errs.length?'warnbox':'note'}" style="margin-bottom:10px">تم الاستيراد: ${add} جديد، ${upd} محدث.${errs.length?'<br>'+errs.map(esc).join('<br>'):''}</div>`;
  }catch(err){toast('تعذّر قراءة الملف: '+err.message)}};fr.readAsArrayBuffer(f);
}

/* ---------- الإعدادات ---------- */
function viewSettings(){
  const st=state.settings,W=st.windows,B=st.bands;
  return `<h2>الإعدادات والسياسة</h2><div class="grid g2" style="margin-top:10px">
   <div class="card"><h3>دورة الأداء</h3><div class="grid g3"><div><label>بداية الدورة</label><input type="date" id="s_cs" value="${st.cycleStart}"></div><div><label>نهاية النصف الأول</label><input type="date" id="s_me" value="${st.midEnd}"></div><div><label>نهاية الدورة</label><input type="date" id="s_ce" value="${st.cycleEnd}"></div></div>
    <label>تاريخ المحاكاة (للتجربة فقط — اتركه فارغًا للتشغيل الفعلي)</label><div class="row"><input type="date" id="s_sim" value="${st.simDate||''}" style="flex:1"><button class="sec sm" onclick="$('s_sim').value=''">مسح</button></div></div>
   <div class="card"><h3>نوافذ الرفع (أيام بعد نهاية الفترة)</h3><div class="grid g3">${Object.keys(W).map(k=>`<div><label>${FREQ_LBL[k]}</label><input type="number" min="1" id="s_w_${k}" value="${W[k]}"></div>`).join('')}</div><div class="xs muted">التسليم النهائي: مفتوح من بداية الدورة حتى الموعد + الأيام المحددة.</div></div>
   <div class="card"><h3>حدود التقدير (البند 2.3)</h3><div class="grid g4"><div><label>الدرجة 5 من</label><input type="number" id="s_b5" value="${B.r5}"></div><div><label>الدرجة 4 من</label><input type="number" id="s_b4" value="${B.r4}"></div><div><label>الدرجة 3 من</label><input type="number" id="s_b3" value="${B.r3}"></div><div><label>الدرجة 2 من</label><input type="number" id="s_b2" value="${B.r2}"></div></div>
    <label>الحد الأعلى لنسبة الإنجاز المعتمدة لأي فترة (%)</label><input type="number" id="s_max" value="${st.maxPct}">
    <label class="row" style="gap:6px;margin-top:10px"><input type="checkbox" id="s_g" ${st.gating?'checked':''} style="width:auto"> تطبيق شرط الإدارة: الدرجة 5 تتطلب منجزًا ومبادرة معتمدين، والدرجة 4 تتطلب مبادرة ذات أثر على الإدارة</label></div>
   <div class="card"><h3>أوزان التقييم حسب الفئة (البند 2.2)</h3>${Object.keys(CAT_LBL).map(k=>`<div class="row"><span style="flex:1" class="sm">${CAT_LBL[k]}</span><span class="xs">الأهداف</span><input type="number" id="s_wt_${k}" value="${st.weights[k][0]}" style="width:80px"><span class="xs">الجدارات/المؤشرات العامة = 100 − الأهداف</span></div>`).join('')}</div>
  </div>
  <div class="card" style="margin-top:14px"><h3>هوية الشركات</h3><div class="grid g3">${CO_KEYS.map(k=>{const b=brand(k);return `<div class="card"><label>الاسم</label><input id="b_n_${k}" value="${esc(b.name)}"><label>الاسم بالإنجليزية</label><input id="b_e_${k}" value="${esc(b.en)}"><div class="row"><div style="flex:1"><label>اللون الرئيسي</label><input type="color" id="b_p_${k}" value="${b.pri}" style="height:38px"></div><div style="flex:1"><label>اللون الثانوي</label><input type="color" id="b_a_${k}" value="${b.acc}" style="height:38px"></div></div><label>الشعار (PNG/SVG حتى 300 كيلوبايت)</label><input type="file" accept="image/*" onchange="App.logo('${k}',this)">${b.logo?`<img src="${b.logo}" style="max-height:50px;margin-top:6px"><button class="ghost sm" onclick="App.logo('${k}',null)">إزالة</button>`:''}</div>`}).join('')}</div>
   <div class="xs muted" style="margin-top:6px">ألوان خبراء التقنية واديكو افتراضية — حدّثها وارفع الشعارات الرسمية المعتمدة من كل شركة.</div></div>
  <div class="row" style="margin-top:14px"><button onclick="App.saveSettings()">حفظ الإعدادات</button></div>`;
}
function saveSettings(){
  const st=state.settings;st.cycleStart=val('s_cs');st.midEnd=val('s_me');st.cycleEnd=val('s_ce');st.simDate=val('s_sim')||'';
  Object.keys(st.windows).forEach(k=>st.windows[k]=Math.max(1,+val('s_w_'+k)||1));st.bands={r5:+val('s_b5'),r4:+val('s_b4'),r3:+val('s_b3'),r2:+val('s_b2')};st.maxPct=+val('s_max')||150;st.gating=$('s_g').checked;
  Object.keys(CAT_LBL).forEach(k=>{const g=Math.min(100,Math.max(0,+val('s_wt_'+k)));st.weights[k]=[g,100-g]});
  CO_KEYS.forEach(k=>{const b=brand(k);b.name=val('b_n_'+k)||b.name;b.en=val('b_e_'+k);b.pri=val('b_p_'+k);b.acc=val('b_a_'+k)});
  log('تحديث الإعدادات');save();render();toast('تم حفظ الإعدادات');
}
function logo(k,inp){if(!inp){brand(k).logo='';save();render();return}const f=inp.files[0];if(!f)return;if(f.size>300*1024){toast('الشعار أكبر من 300 كيلوبايت');return}const fr=new FileReader();fr.onload=()=>{brand(k).logo=fr.result;save();render()};fr.readAsDataURL(f)}

/* ---------- القوائم الاستراتيجية ---------- */
function viewLists(v){
  const ed=v.role==='admin'||v.role==='delegate',ta=(id,l)=>`<textarea id="${id}" style="min-height:300px;font-size:13px" ${ed?'':'disabled'}>${esc(l.map(x=>x[0]+' | '+x[1]).join('\n'))}</textarea>`;
  return `<h2>القوائم الاستراتيجية</h2><div class="note" style="margin:10px 0">صيغة كل سطر: <b>الرمز | الاسم</b>. شركة المياه الوطنية تُربط بأهداف الشركة الاستراتيجية ومبادراتها (استراتيجية 2026–2030، النسخة الثانية). خبراء التقنية واديكو تُربطان بأهداف الإدارة 2027 بوصفها أهدافًا استراتيجية لهما.</div>
  <div class="grid g3"><div class="card"><h3>أهداف NWC الاستراتيجية</h3>${ta('l_s',state.lists.strat)}</div><div class="card"><h3>المبادرات الاستراتيجية (27)</h3>${ta('l_i',state.lists.init)}</div><div class="card"><h3>أهداف الإدارة 2027 (خبراء/اديكو)</h3>${ta('l_d',state.lists.dept)}</div></div>
  ${ed?`<div class="row" style="margin-top:12px"><button onclick="App.saveLists()">حفظ القوائم</button></div>`:''}`;
}
function saveLists(){const p=id=>val(id).split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(x=>x[0]).map(x=>[x[0],x[1]||'']);state.lists={strat:p('l_s'),init:p('l_i'),dept:p('l_d')};log('تحديث القوائم الاستراتيجية');save();toast('تم الحفظ')}

/* ---------- السجل والبيانات ---------- */
function viewLog(){return `<h2>سجل العمليات</h2><div class="card" style="padding:0;overflow:auto;margin-top:10px"><table><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th></tr>${state.log.slice(0,400).map(l=>`<tr><td class="xs">${esc(l.ts.replace('T',' ').slice(0,16))}</td><td class="sm">${esc(l.user)}</td><td class="sm">${esc(l.action)}</td></tr>`).join('')}</table></div>`}
function viewData(){
  let size=0;try{size=(localStorage.getItem(KEY)||'').length}catch(e){}
  return `<h2>البيانات</h2><div class="warnbox" style="margin:10px 0">النموذج الأولي يحفظ البيانات في متصفحك فقط (${Math.round(size/1024)} كيلوبايت). لا يراها غيرك ولا تنتقل لجهاز آخر. النسخة التشغيلية تحتاج قاعدة بيانات مركزية.</div>
  <div class="grid g2"><div class="card"><h3>تصدير</h3><button onclick="App.exportData()">نسخ البيانات (JSON)</button><textarea id="exp" style="margin-top:8px;min-height:120px;font-size:11px" readonly></textarea></div>
  <div class="card"><h3>استيراد</h3><input type="file" accept=".json,.txt" onchange="App.importData(this)"><div class="hr"></div><h3>إعادة الضبط</h3><div class="row"><button class="sec" onclick="App.resetDemo()">إعادة البيانات التجريبية</button><button class="bad" onclick="App.clearAll()">مسح كل شيء عدا مدير النظام</button></div></div></div>`;
}
function exportData(){const t=JSON.stringify(state);$('exp').value=t;try{navigator.clipboard.writeText(t).then(()=>toast('تم النسخ'),()=>toast('حدد النص وانسخه يدويًا'))}catch(e){toast('حدد النص وانسخه يدويًا')}}
function importData(inp){const f=inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o.users||!o.settings)throw new Error('ملف غير صالح');state=o;save();render();toast('تم الاستيراد')}catch(e){toast('خطأ: '+e.message)}};fr.readAsText(f)}
function resetDemo(){confirmBox('إعادة البيانات التجريبية ستحذف كل ما أُدخل. متابعة؟',()=>{state=makeDemo();save();S.view='home';render();toast('تمت إعادة الضبط')})}
function clearAll(){confirmBox('سيُحذف جميع المستخدمين والأهداف والإنجازات عدا حساب مدير النظام. متابعة؟',()=>{const a=me();state.users=[a];a.manager='';state.goals=[];state.updates=[];state.initiatives=[];state.achievements=[];state.evals={};state.exceptions=[];state.goalMeta={};state.settings.simDate='';log('مسح كامل للبيانات');save();render();toast('تم')})}

/* ---------- اعتماد/فتح الأهداف ---------- */
function lockGoals(uid){const s=stats(U(uid));if(s.wTot!==100){toast('مجموع الأوزان يجب أن يكون 100%');return}const bad=goalsOf(uid).find(g=>Math.abs(g.subs.reduce((a,x)=>a+(+x.weight||0),0)-g.weight)>0.01);if(bad){toast('أوزان الفرعية في «'+bad.title+'» غير مطابقة');return}meta(uid).locked=true;meta(uid).lockedBy=me().name;meta(uid).lockedTs=nowTs();log('اعتماد أهداف '+U(uid).name);save();render();toast('تم اعتماد الأهداف')}
function unlockGoals(uid){openModal(`<h3>فتح الأهداف للتعديل</h3><label>السبب (يُحفظ في سجل التعديلات المعتمدة)</label><input id="ul_r"><div class="row" style="margin-top:10px"><button onclick="App.doUnlock('${uid}')">فتح</button><button class="sec" onclick="App.close()">إلغاء</button></div>`)}
function doUnlock(uid){const r=val('ul_r');if(!r){toast('السبب مطلوب');return}const m=meta(uid);m.locked=false;m.changes.push({ts:nowTs(),by:me().name,reason:'فتح للتعديل: '+r});log('فتح أهداف '+U(uid).name);save();closeModal();render()}
function goalDel(gid){confirmBox('حذف الهدف وجميع إنجازاته؟',()=>{const g=state.goals.find(x=>x.id===gid),ids=new Set(g.subs.map(s=>s.id));state.updates=state.updates.filter(u=>!ids.has(u.subId));state.goals=state.goals.filter(x=>x.id!==gid);if(meta(g.userId).locked)meta(g.userId).changes.push({ts:nowTs(),by:me().name,reason:'حذف «'+g.title+'»'});log('حذف هدف '+g.title);save();closeModal();render()})}

/* ---------- نوافذ وإشعارات ---------- */
function openModal(h){$('modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)App.close()"><div class="modal">${h}</div></div>`}
function closeModal(){$('modal').innerHTML=''}
let tt;function toast(m){$('toast').innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>$('toast').innerHTML='',2600)}
let cbFn=null;function confirmBox(m,fn){cbFn=fn;openModal(`<h3>تأكيد</h3><p>${esc(m)}</p><div class="row"><button class="bad" onclick="App.cb()">نعم</button><button class="sec" onclick="App.close()">إلغاء</button></div>`)}

/* ---------- واجهة الأحداث ---------- */
window.App={render,go,close:closeModal,period,submitUpd,reviewUpd,comment,addExc,goalEdit,goalSave,goalDel,lockGoals,unlockGoals,doUnlock,
  subAdd(){draftSubs.push({id:nid(),title:'',kpi:'',target:'',method:'',weight:'',freq:'monthly',due:''});drawSubs()},subDel(i){draftSubs.splice(i,1);drawSubs()},subSet(i,k,v){draftSubs[i][k]=v},redrawSubs:drawSubs,subSum,
  initForm,initSave,reviewInit,evSet,evFinal,evReopen,evAck,userEdit,userSave,importXl,saveSettings,logo,saveLists,exportData,importData,resetDemo,clearAll,cb(){const f=cbFn;cbFn=null;closeModal();f&&f()},
  tab(t){S.tab=t;saveSess();render()},
  pick(c){S.company=c;S.userId=null;saveSess();render()},
  login(){const e=val('em'),u=byEmail(e),err=$('lerr');
    if(!u||u.active===false){err.innerHTML='<div class="errbox" style="margin-top:8px">البريد غير مسجل في النظام أو الحساب موقوف.</div>';return}
    if(!u.companies.includes(S.company)){err.innerHTML=`<div class="errbox" style="margin-top:8px">غير مصرح لك بالدخول على ${esc(brand(S.company).name)}. الشركات المتاحة لك: ${u.companies.map(c=>esc(brand(c).name)).join('، ')}.</div>`;return}
    S.userId=u.id;S.view='home';S.tab='goals';log('تسجيل دخول — '+brand(S.company).name);save();saveSess();render()},
  logout(){S.userId=null;S.view='home';saveSess();render()},
  switchCo(c){S.company=c;S.view='home';S.allCo=false;saveSess();render()}};
load();render();
</script>
